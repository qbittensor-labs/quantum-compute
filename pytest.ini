[pytest]
pythonpath = .
testpaths = tests
norecursedirs = qbittensor/miner
addopts = -ra -m "not integration"
markers =
    integration: requires Docker or external services (skipped by default)
asyncio_mode = auto
filterwarnings =
    ignore:pkg_resources is deprecated:DeprecationWarning
    ignore::DeprecationWarning
